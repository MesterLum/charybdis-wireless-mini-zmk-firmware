manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: 280Zo
      url-base: https://github.com/280Zo
    - name: t-ogura
      url-base: https://github.com/t-ogura

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: 280Zo
      revision: main
    # Prospector SCANNER module (t-ogura), not the dongle one (280Zo).
    # The scanner is a standalone device that passively listens to BLE status
    # advertisements, so the keyboard stays a normal BT split - it only has to
    # broadcast (see CONFIG_ZMK_STATUS_ADVERTISEMENT in charybdis_right_bt.conf).
    # West forbids two projects with the same name, so this REPLACES the 280Zo
    # module; the dongle_prospector_* entries in build.yaml no longer build.
    # No explicit `path:` on purpose - it must stay at the workspace root
    # because build_setup.sh and .github/workflows/build.yml hardcode
    # ZMK_EXTRA_MODULES=.../prospector-zmk-module there.
    - name: prospector-zmk-module
      remote: t-ogura
      revision: v2.2.1

  self:
    path: config
