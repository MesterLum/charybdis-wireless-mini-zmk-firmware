## Split keyboards
## https://zmk.dev/docs/config/system#split-keyboards
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## ZMK Studio
## https://zmk.dev/docs/features/studio
CONFIG_ZMK_STUDIO=y
## https://zmk.dev/docs/config/studio
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_INPUT_LISTENER=y

## PMW3610 Driver
## https://github.com/badjeff/zmk-pmw3610-driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y
#CONFIG_SPI_LOG_LEVEL_DBG=y

## https://github.com/badjeff/zmk-pmw3610-driver/blob/main/src/pmw3610.c
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

## Swap/Invert are now DTS properties in pixart,pmw3610-alt - see charybdis_pmw3610.dtsi
# CONFIG_PMW3610_ALT_SWAP_XY=y // deprecated
# CONFIG_PMW3610_ALT_INVERT_X=y // deprecated
# CONFIG_PMW3610_ALT_INVERT_Y=y // deprecated
# 0 disables the driver's report throttle entirely. It was 12 (83Hz), then 8
# (125Hz) while force-awake-4ms-mode made the sensor sample every 4ms. With
# force-awake disabled the sensor samples at its native 8ms/125Hz, so a 8ms
# throttle now collides with the sampling period: the purge at pmw3610.c:514
# ("now - last_smp_time >= INTERVAL") fires on nearly every sample and discards
# the accumulator, and the gate at :527 drops whole samples on timer jitter.
# Net effect was losing roughly half the motion -> pointer felt very slow.
# At 0 both #if blocks compile out and every sample is reported directly.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=0

# 40ms (the driver default) instead of 100ms. This is the sampling period the
# sensor uses in REST1, which is the stage you land in after any short pause -
# so it IS the wake latency on the first nudge. 100ms felt like the ball
# "started heavy"; 40ms is 2.5x snappier. No range limit on this symbol.
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300
# 3264 is the HARD MAXIMUM - the Kconfig declares "range 13 3264" and anything
# above it is rejected with "outside the active range", which ZMK escalates to a
# build error. (A 10000 attempt failed here.) So RUN can only be stretched from
# 2s to ~3.3s; the rest of the wake latency is fixed by REST1_SAMPLE_TIME_MS below.
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting
